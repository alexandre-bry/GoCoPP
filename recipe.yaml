package:
  name: gocopp
  version: 0.1.0

source:
  path: ./GoCoPP

build:
  number: 0
  script: |
    # Apply patch with Python (cross-platform)
    python "recipe/patch_cgal.py" || echo "CGAL patch skipped"

    # Build with CMake (cross-platform)
    cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX
    cmake --build build --config Release
    cmake --install build --prefix $PREFIX

requirements:
  build:
    - cmake >=3.10
    - ${{ compiler('cxx') }}
    - python  # Required for cross-platform patching
    - make  # [unix]
  host:
    - cgal >=5.6,<6
    - eigen >=3.4.0,<4
    - boost-cpp >=1.76
  run:
    - cgal >=5.6,<6
    - eigen >=3.4.0,<4
    - boost-cpp >=1.76

about:
  homepage: https://github.com/alexandre-bry/GoCoPP
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Finding Good Configurations of Planar Primitives in Unorganized Point Clouds
  repository: https://github.com/alexandre-bry/GoCoPP